spring.application.name=pantrypal

# ---------- Database ----------
# Values come from environment variables. The defaults after ":" work for a
# local MariaDB/MySQL with a database named "pantrypal". Never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/pantrypal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Creates/updates tables automatically from the Java entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ---------- OAuth (Google / GitHub login) ----------
# Disabled for now. To turn it on: create your own OAuth apps, put the IDs and
# secrets in environment variables, uncomment these lines, and uncomment
# .oauth2Login(...) in config/AppConfig.java.
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
#spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# Where the backend sends users after OAuth login (your Expo web URL).
app.frontend-url=${FRONTEND_URL:http://localhost:8081}

# ---------- Logging ----------
logging.level.group15.pantrypal=INFO

server.servlet.session.cookie.same-site=None
